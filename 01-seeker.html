<script type="module">

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const YX = SK ? SK.YARD.x : -1000, YZ = SK ? SK.YARD.z : 2400, SHIP_Y = SK ? SK.SHIP_Y : 48;

const renderer = new THREE.WebGLRenderer({ antialias: true });

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 60000);
camera.position.set(YX + 560, 300, YZ + 520);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(YX, 50, YZ); controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495; controls.maxDistance = 9000; controls.minDistance = 20;

const sunDir = V(0.9, 0.7, 0.4).normalize();

sun.position.copy(sunDir).multiplyScalar(2500).add(V(YX, 0, YZ)); sun.target.position.set(YX, 0, YZ);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -520, right: 520, top: 520, bottom: -520, near: 100, far: 6000 });

const hemiMain = new THREE.HemisphereLight(0xbcd4ff, 0x6a5a48, 0.75); scene.add(hemiMain);

function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t; }
const signTex = (txt, bg = '#12233a', fg = '#f2f2f2') => canvasTex(1024, 128, (g, w, h) => { g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = fg; g.textBaseline = 'middle'; g.textAlign = 'center'; let fs = 76; do { g.font = 'bold ' + fs + 'px Arial'; fs -= 2; } while (g.measureText(txt).width > w - 60); g.fillText(txt, w / 2, h / 2); });
const world = new THREE.Group(); scene.add(world);
/* ================= PEOPLE (crew, workers, EVA builders) ================= */
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PEOPLE = (() => {
  const mat = (c, r = 0.7, m = 0, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m, ...extra });
  const capG = (r, len) => { const g = new THREE.CapsuleGeometry(r, len, 6, 16); g.translate(0, -len / 2, 0); return g; };
  const lathe = (pts, sx = 1, sz = 0.62, sy = 1) => { const g = new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), 32); g.scale(sx, sy, sz); g.computeVertexNormals(); return g; };
  const sph = new THREE.SphereGeometry(1, 32, 24);
  const fabricTex = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2200; i++) { const v = 225 + Math.random() * 30 | 0; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(Math.random() * w, Math.random() * h, 1, 2); }
  });
  fabricTex.wrapS = fabricTex.wrapT = THREE.RepeatWrapping; fabricTex.repeat.set(3, 3);
  const cloth = (c, r = 0.85) => mat(c, r, 0, { map: fabricTex });
  const patchTex = {};
  const namePatch = (name, col) => patchTex[name + col] || (patchTex[name + col] = canvasTex(256, 64, (g, w, h) => {
    g.fillStyle = col; g.fillRect(0, 0, w, h); g.strokeStyle = '#c9a54a'; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
    g.fillStyle = '#e9e4d6'; g.font = 'bold 34px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(name, w / 2, h / 2 + 2);
  }));
  const missionTex = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#0d2350'; g.beginPath(); g.arc(64, 64, 62, 0, 7); g.fill();
    g.strokeStyle = '#d9b44a'; g.lineWidth = 6; g.stroke();
    g.fillStyle = '#e8eef8'; g.beginPath(); g.moveTo(64, 20); g.lineTo(80, 84); g.lineTo(64, 74); g.lineTo(48, 84); g.closePath(); g.fill();
    g.fillStyle = '#d9b44a'; g.font = 'bold 16px Arial'; g.textAlign = 'center'; g.fillText('STATION-7', 64, 106);
  });
  const flagTex = canvasTex(96, 64, (g, w, h) => { g.fillStyle = '#1b3f8a'; g.fillRect(0, 0, w, h); g.fillStyle = '#e8e8e8'; g.fillRect(0, 26, w, 12); g.fillRect(40, 0, 16, h); g.fillStyle = '#d9b44a'; g.beginPath(); g.arc(48, 32, 9, 0, 7); g.fill(); });

  const SKIN = ['#f3cdb0', '#e6b48f', '#cf9a74', '#b07a55', '#8a5a3c', '#5e3b27'];
  const HAIR = ['#17110e', '#2e1d13', '#4a2f1c', '#7a5230', '#b48a55', '#d8c49a', '#7d7d7d'];
  const EYE = ['#4a3020', '#2f4f6f', '#3f5f3a', '#5a4030'];

  function makePerson(o) {
    const R = mulberry(o.seed || 7);
    const pick = a => a[R() * a.length | 0];
    const kind = o.kind, A = kind === 'astro', fem = !!o.female;
    const SA = A ? 1.55 : 1, SL = A ? 1.4 : 1, ST = A ? 1.3 : 1;
    const root = new THREE.Group(), J = {}, extra = {};
    const add = (geo, m, parent, x = 0, y = 0, z = 0) => { const me = new THREE.Mesh(geo, m); me.position.set(x, y, z); me.castShadow = me.receiveShadow = true; parent.add(me); return me; };
    const grp = (parent, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };
    const skinC = o.skin || pick(SKIN), hairC = o.hair || pick(HAIR);
    const skin = mat(skinC, 0.55, 0, { envMapIntensity: 0.5 });
    const hairM = mat(hairC, 0.75, 0.05);
    // outfit
    let top, legs, arms, hands, shoes;
    if (kind === 'crew') {
      const suit = cloth(o.suit || '#1b2433', 0.8);
      top = legs = arms = suit; hands = skin; shoes = mat('#0c0d10', 0.25, 0.3);
    } else if (kind === 'worker') {
      top = arms = cloth(o.shirt || pick(['#3a4a5e', '#5b6470', '#2d3b4c', '#6a5a48'])); legs = cloth(o.pants || pick(['#2c3a52', '#4a4234', '#3a3a3a', '#5a4b36']));
      hands = cloth('#b58a52', 0.9); shoes = mat('#4a2e1a', 0.6, 0);
    } else {
      top = legs = arms = cloth('#eef0f2', 0.92); hands = cloth('#e4e6ea', 0.9); shoes = cloth('#d2d5da', 0.8);
    }
    // ---- skeleton ----
    J.hips = grp(root, 0, 0.95, 0);
    add(lathe([[0, -0.13], [0.115, -0.125], [0.16, -0.07], [(fem ? 0.172 : 0.162), -0.01], [0.15, 0.05], [0, 0.05]], ST, 0.66), legs, J.hips);
    J.spine = grp(J.hips, 0, 0.04, 0);
    const tp = fem
      ? [[0, 0], [0.135, 0], [0.122, 0.09], [0.138, 0.17], [0.158, 0.24], [0.162, 0.3], [0.148, 0.355], [0.1, 0.395], [0.05, 0.415], [0, 0.415]]
      : [[0, 0], [0.142, 0], [0.138, 0.08], [0.15, 0.16], [0.176, 0.25], [0.186, 0.32], [0.172, 0.37], [0.12, 0.41], [0.06, 0.43], [0, 0.43]];
    const sy = A ? 1.06 : 1;
    add(lathe(tp, ST, 0.62, sy), top, J.spine);
    const topY = tp[tp.length - 1][1] * sy;
    J.neck = grp(J.spine, 0, topY, 0);
    add(new THREE.CylinderGeometry(0.046, 0.052, 0.12, 16), skin, J.neck, 0, 0.03, 0);
    J.head = grp(J.neck, 0, 0.075, 0.01);
    // ---- head & face ----
    const H = J.head;
    add(sph, skin, H, 0, 0.11, 0).scale.set(fem ? 0.088 : 0.092, fem ? 0.112 : 0.116, 0.106);
    add(sph, skin, H, 0, 0.048, 0.02).scale.set(fem ? 0.068 : 0.076, 0.056, 0.082);
    const nose = add(new RoundedBoxGeometry(0.022, 0.048, 0.032, 2, 0.009), skin, H, 0, 0.097, 0.103); nose.rotation.x = -0.18;
    for (const s of [-1, 1]) {
      add(sph, skin, H, s * 0.093, 0.1, -0.004).scale.set(0.013, 0.03, 0.022);
      const eye = grp(H, s * 0.033, 0.12, 0.084);
      add(sph, mat('#f4f1ea', 0.3), eye).scale.setScalar(0.0135);
      add(sph, mat(o.eye || pick(EYE), 0.25), eye, 0, 0, 0.0085).scale.set(0.0078, 0.0078, 0.0045);
      add(sph, mat('#050505', 0.1), eye, 0, 0, 0.012).scale.set(0.0036, 0.0036, 0.002);
      const lid = add(new THREE.SphereGeometry(0.0148, 16, 8, 0, Math.PI * 2, 0, Math.PI * 0.42), skin, eye); lid.rotation.x = 0.15;
      (extra.lids = extra.lids || []).push(lid);
      const brow = add(new RoundedBoxGeometry(0.036, 0.008, 0.012, 2, 0.003), hairM, H, s * 0.034, 0.141, 0.099); brow.rotation.z = -s * 0.1;
      add(sph, skin, H, s * 0.05, 0.075, 0.078).scale.set(0.03, 0.025, 0.025);
    }
    add(new RoundedBoxGeometry(0.038, 0.007, 0.012, 2, 0.003), mat(fem ? '#9a4a4e' : '#8a5048', 0.5), H, 0, 0.061, 0.096);
    add(new RoundedBoxGeometry(0.03, 0.007, 0.01, 2, 0.003), mat(fem ? '#a8595c' : '#93594f', 0.5), H, 0, 0.053, 0.093);
    const hs = o.hairStyle || (fem ? pick(['bun', 'long', 'bob']) : pick(['short', 'short', 'buzz', 'bald']));
    if (!A && hs !== 'bald') {
      const cap = add(new THREE.SphereGeometry(1, 32, 16, 0, Math.PI * 2, 0, Math.PI * (hs === 'buzz' ? 0.5 : 0.56)), hairM, H, 0, 0.112, -0.006);
      cap.scale.set(fem ? 0.095 : 0.097, fem ? 0.121 : 0.121, 0.113); cap.rotation.x = -0.38;
      if (hs === 'bun') add(sph, hairM, H, 0, 0.17, -0.1).scale.setScalar(0.042);
      if (hs === 'long' || hs === 'bob') add(sph, hairM, H, 0, hs === 'long' ? 0.05 : 0.08, -0.06).scale.set(0.098, hs === 'long' ? 0.14 : 0.09, 0.065);
    }
    if (o.beard) add(sph, hairM, H, 0, 0.042, 0.024).scale.set(0.079, 0.058, 0.082);
    // ---- arms ----
    for (const [s, n] of [[1, 'L'], [-1, 'R']]) {

      add(capG(0.05 * SA, 0.25), arms, sh);
      const el = J['el' + n] = grp(sh, 0, -0.285, 0);
      add(capG(0.042 * SA, 0.22), arms, el);
      const wr = J['wr' + n] = grp(el, 0, -0.255, 0);
      const k = A ? 1.35 : 1;
      add(new RoundedBoxGeometry(0.032 * k, 0.088 * k, 0.078 * k, 2, 0.012 * k), hands, wr, 0, -0.045 * k, 0);
