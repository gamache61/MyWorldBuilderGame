<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Builder — Choose What to Build</title>
<style>
  :root { --ink: #d8ecff; --dim: #8fb0c8; --line: rgba(127, 216, 255, .35); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 120%, #10263d 0%, #050b14 55%, #02050a 100%);
    color: var(--ink); font-family: "Segoe UI", Arial, sans-serif; overflow-x: hidden; min-height: 100%;
  }
  #stars { position: fixed; inset: 0; z-index: 0; }
  main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 64px 24px 48px; }
  h1 { margin: 0; text-align: center; font-weight: 600; letter-spacing: 10px; font-size: clamp(26px, 5vw, 48px); color: #fff; text-shadow: 0 0 24px rgba(64, 208, 255, .45); }
  .sub { text-align: center; color: #7fd8ff; letter-spacing: 4px; font-size: 13px; margin: 14px 0 48px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; }
  .card {
    position: relative; display: flex; flex-direction: column; gap: 14px; padding: 26px 24px 22px;
    background: linear-gradient(160deg, rgba(14, 34, 54, .88), rgba(6, 14, 24, .92));
    border: 1px solid var(--line); border-radius: 8px; color: inherit; text-decoration: none;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 8px 0 0 8px; background: var(--c); }
  .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--c); box-shadow: 0 10px 34px rgba(0, 0, 0, .5), 0 0 22px color-mix(in srgb, var(--c) 35%, transparent); outline: none; }
  .card h2 { margin: 0; font-size: 19px; letter-spacing: 3px; color: #fff; font-weight: 600; }
  .card p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.55; flex: 1; }
  .meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: 2px; }
  .meta span { color: var(--c); }
  .go { padding: 8px 16px; border: 1px solid var(--c); border-radius: 4px; color: #fff; background: color-mix(in srgb, var(--c) 18%, transparent); }
  .card:hover .go { background: color-mix(in srgb, var(--c) 35%, transparent); }
  .empty { text-align: center; color: #ffb040; letter-spacing: 2px; font-size: 14px; line-height: 1.8; }
  footer { text-align: center; color: #4f6b82; font-size: 11px; letter-spacing: 3px; margin-top: 56px; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<main>
  <h1>WORLD BUILDER</h1>
  <div class="sub">CHOOSE WHAT TO BUILD</div>
  <div class="grid" id="grid"></div>
  <footer>GAMACHE GAMES</footer>
</main>
<script src="projects/projects.js"></script>
<script>
  const list = window.SPACE_PROJECTS || [], grid = document.getElementById('grid');
  if (!list.length) grid.outerHTML = '<div class="empty">NO PROJECTS FOUND<br>PUT projects.js IN THE projects FOLDER NEXT TO index.html</div>';
  for (const p of list) {
    const a = document.createElement('a');
    a.className = 'card'; a.href = p.html; a.style.setProperty('--c', p.color || '#40d0ff');
    const h = document.createElement('h2'); h.textContent = p.name;
    const d = document.createElement('p'); d.textContent = p.brief || '';
    const m = document.createElement('div'); m.className = 'meta';
    const b = document.createElement('span'); b.textContent = p.label || ((p.builds || 0) + ' BUILDS');
    const g = document.createElement('div'); g.className = 'go'; g.textContent = 'START ▶';
    m.append(b, g); a.append(h, d, m); grid.appendChild(a);
  }
  // drifting star field
  const cv = document.getElementById('stars'), cx = cv.getContext('2d');
  let W, H, stars = [];
  function size() {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    stars = Array.from({ length: Math.round(W * H / 2600) }, () => ({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 0.9 + 0.1 }));
  }
  addEventListener('resize', size); size();
  (function draw() {
    cx.clearRect(0, 0, W, H);
    for (const s of stars) {
      s.x -= s.z * 0.15; if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
      cx.fillStyle = `rgba(200,230,255,${0.25 + s.z * 0.7})`; cx.fillRect(s.x, s.y, s.z * 1.8, s.z * 1.8);
    }
    requestAnimationFrame(draw);
  })();
</script>
</body>
</html>
