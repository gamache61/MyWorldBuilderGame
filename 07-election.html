/* walking: follow a list of points; y can change (up the stage steps) */
function face(c, ry, dt) { let d = ry - c.P.root.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); c.P.root.rotation.y += d * Math.min(1, dt * 6); }
function goTo(c, pts, done, speed = 1.4) { c.path = pts.map(p => p.clone ? p.clone() : V(p[0], p[1], p[2])); c.done = done; c.speed = speed; c.act = 'walk'; }
function moveCrowd(dt, t) {
  for (const c of crowd) {
    if (c.wait > 0) { c.wait -= dt; if (c.wait <= 0 && c.afterWait) { const f = c.afterWait; c.afterWait = null; f(); } }
    else if (c.path && c.path.length) {
      const p = c.P.root.position, tgt = c.path[0], d = V(tgt.x - p.x, 0, tgt.z - p.z), L = d.length(), step = c.speed * dt;
      if (L > 0.05) face(c, Math.atan2(d.x, d.z), dt);
      if (L <= step) { p.x = tgt.x; p.z = tgt.z; p.y = tgt.y; c.path.shift(); if (!c.path.length) { c.act = 'idle'; const f = c.done; c.done = null; if (f) f(); } }
      else { const k = step / L; p.x += d.x * k; p.z += d.z * k; p.y += (tgt.y - p.y) * Math.min(1, k * 1.0 + 0); }
    } else if (c.faceTo !== undefined) face(c, c.faceTo, dt);
    PEOPLE.A[c.act] ? PEOPLE.A[c.act](c.P, t, dt) : PEOPLE.A.idle(c.P, t, dt);
  }
}

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
let sendT = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  // what time of day it is
  if (G.done) prog = 0.52;
  else if (G.phase === 'dusk') prog = Math.min(0.97, prog + dt * 0.12);
  else if (G.day === 0) prog = G.phase === 'speeches' ? 0.08 + 0.5 * Math.max(0, curSpeaker) / 14 : 0.06;
  else if (G.day === 1) prog = polls ? 0.08 + 0.55 * Math.min(1, polls.t / polls.dur) : 0.06;
  else prog = G.phase === 'count' ? 0.08 + 0.3 * Math.min(1, count.t / count.dur) : G.phase === 'winners' ? 0.4 : G.phase === 'keeper' ? 0.49 : 0.06;
  DN.update(dt, G.day, prog, true, [sun, hemiMain], sun);
  const night = DN.dark;
  lampGlow.emissiveIntensity = night * 2.2; for (const l of lampLights) l.intensity = night * 60;
  for (const m of towerMats) m.emissiveIntensity = night * 1.1;
  // the polls
  if (polls && G.phase === 'polls') {
    polls.t += dt; sendT -= dt;
    if (polls.t < polls.dur && sendT <= 0 && voters.length < 16) { sendVoter(); sendT = 1.1; }
    const k = Math.min(1, polls.t / polls.dur); if (Math.abs(k - (screenArg || 0)) > 0.002) { screenArg = k; drawScreen(); }
    if (polls.t >= polls.dur && G.vote >= 0 && !voters.length) { polls = null; screenArg = 1; drawScreen(); endDay('THE POLLS ARE CLOSED', 'TOMORROW THE VOTES ARE COUNTED'); }
  }
  if (count && G.phase === 'count') { count.t += dt; const k = Math.min(1, count.t / count.dur); screenArg = k * k * (3 - 2 * k); drawScreen(); if (k >= 1) { count = null; countDone(); } }
  for (let i = pulses.length - 1; i >= 0; i--) { const p = pulses[i]; p.t += dt; p.m.position.y = 4.5 + p.t * 12; p.m.material.opacity = Math.max(0, 1 - p.t / 1.2); if (p.t > 1.2) { world.remove(p.m); pulses.splice(i, 1); } }
  pillar.material.emissiveIntensity = 0.6 + (pulses.length ? 0.8 : 0) + Math.sin(t * 2) * 0.1;
  // the Keeper's light
  if (keeper) {
    keeper.beam += ((keeper.on ? 1 : 0) - keeper.beam) * Math.min(1, dt * 1.5);
    const b = keeper.beam, p = mira.P.root.position;
    beam.visible = halo.visible = b > 0.01; beam.position.set(p.x, p.y + 200, p.z); beam.scale.set(1.2 + Math.sin(t * 7) * 0.1, 400, 1.2 + Math.sin(t * 7) * 0.1); beam.material.opacity = b * 0.4;
    halo.position.set(p.x, p.y + 1, p.z); halo.scale.setScalar(1.3 + Math.sin(t * 3) * 0.1); halo.material.opacity = b * 0.35;
    keeperLight.position.set(p.x, p.y + 4, p.z); keeperLight.intensity = b * 120;
    if (G.phase === 'done' && b < 0.01) keeper = null;
  }
  moveCrowd(dt, t);
  updateCamera(dt, t);
  hud(dt);
  composer.render();
});

</script>
