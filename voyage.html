const SAVE_KEY = 'worldBuilder.voyage.v1';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const $ = id => document.getElementById(id);

const sun = new THREE.DirectionalLight(0xfff1dc, 3.0); sun.position.copy(sunDir).multiplyScalar(5000); scene.add(sun);
scene.add(new THREE.HemisphereLight(0x8fb0ff, 0x101018, 0.35));

{
  const n = 9000, p = new Float32Array(n * 3), c = new Float32Array(n * 3);

}
// warp streaks
const streaks = (() => {
  const n = 900, p = new Float32Array(n * 6);
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, r = 200 + Math.random() * 2500, x = Math.cos(a) * r, y = Math.sin(a) * r, z = -Math.random() * 12000; p.set([x, y, z, x, y, z - 400], i * 6); }

/* ---------- THE SEEKER — arrowhead explorer, split prow, raised drives (bow toward +z) ---------- */
const ship = new THREE.Group(); scene.add(ship);
const hullTex = (() => { const c = document.createElement('canvas'); c.width = 1024; c.height = 1024; const g = c.getContext('2d'); g.fillStyle = '#a3aab4'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 160; i++) { const v = 150 + Math.random() * 22 | 0; g.fillStyle = `rgb(${v},${v + 4},${v + 10})`; g.fillRect(Math.random() * 1024, Math.random() * 1024, 40 + Math.random() * 120, 20 + Math.random() * 60); }
  g.strokeStyle = 'rgba(50,56,66,.3)'; g.lineWidth = 2; for (let x = 0; x < 1024; x += 96) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 1024); g.stroke(); } for (let y = 0; y < 1024; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(1024, y); g.stroke(); }

const outline = (s) => { const p = new THREE.Shape(), m = (x, y) => [x * s, y * s - (1 - s) * 30];

slab(1, 6, 5, -3, hullA);             // main saucer slab

slab(0.5, 4, 3, 12, hullA);           // top tier

// bridge: glass dome and gold collar on the top tier
add(new THREE.CylinderGeometry(9, 12, 6, 32), hull, 0, 22, 34);
add(new THREE.SphereGeometry(8, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), glass, 0, 25, 34);
add(new THREE.TorusGeometry(9.2, 0.7, 8, 40).rotateX(Math.PI / 2), gold, 0, 25, 34);
// star lens inside the split of the prow
add(new THREE.SphereGeometry(4.5, 20, 14), amber, 0, 2, 150).scale.set(1, 0.6, 1.4);
add(new THREE.TorusGeometry(6, 0.8, 8, 32).rotateY(Math.PI / 2).rotateZ(Math.PI / 2), gold, 0, 2, 150);

/* windows — rows of warm lights following the hull outline */
{
  const pts = [];

  const g = new THREE.BoxGeometry(1.6, 0.5, 1.6); const im = new THREE.InstancedMesh(g, win, pts.length);
  const M4 = new THREE.Matrix4(); pts.forEach((p, i) => { M4.makeTranslation(p[0], p[1], p[2]); im.setMatrixAt(i, M4); }); ship.add(im);
}
// dorsal fin sensor array
{ const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(46, 0); s.quadraticCurveTo(20, 6, -6, 22); s.lineTo(-10, 22); s.lineTo(0, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: 2, bevelEnabled: true, bevelThickness: 0.6, bevelSize: 0.6, bevelSegments: 2 }); g.translate(0, 0, -1); g.rotateY(-Math.PI / 2);

add(new THREE.BoxGeometry(1.2, 1.2, 120), teal, 0, -28.5, -110);

// ventral keel fin
{ const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(70, 0); s.lineTo(40, -14); s.lineTo(8, -10); s.lineTo(0, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: 1.6, bevelEnabled: false }); g.translate(0, 0, -0.8); g.rotateY(-Math.PI / 2); add(g, dark, 0, -26, -150); }

const glows = [];
for (const sx of [-1, 1]) {
  const curve = new THREE.CatmullRomCurve3([V(sx * 14, -16, -112), V(sx * 40, -12, -124), V(sx * 66, 4, -132), V(sx * 82, 22, -128)]);

}

for (let i = 0; i < 4; i++) {

function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
/* ================= PEOPLE (crew, workers, EVA builders) ================= */

const PEOPLE = (() => {
  const mat = (c, r = 0.7, m = 0, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m, ...extra });
  const capG = (r, len) => { const g = new THREE.CapsuleGeometry(r, len, 6, 16); g.translate(0, -len / 2, 0); return g; };
  const lathe = (pts, sx = 1, sz = 0.62, sy = 1) => { const g = new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), 32); g.scale(sx, sy, sz); g.computeVertexNormals(); return g; };
  const sph = new THREE.SphereGeometry(1, 32, 24);

    const wav = await piper.predict({ text: LINES[i], voiceId: KEEPER_VOICE }, p => { if (p.total) $('say').textContent = 'The Keeper is gathering its voice… ' + Math.round(p.loaded / p.total * 100) + '%  (first time only)'; });
    bufs.push(await actx.decodeAudioData(await wav.arrayBuffer()));
  }
  } finally { Blob.prototype.text = realText; }
  return bufs;
}
function finishSpeech() {
  speaking = 0; captainTalking = false; endProof(); $('say').style.opacity = 0; if (drone) drone.gain.linearRampToValueAtTime(0.15, actx.currentTime + 3);
  G.named = true; G.phase = 'done'; save();
  banner('THE GREEN WORLD IS NAMED UNITY', 'NEXT: BUILD THE AEGIS ARK TO CARRY THE PARTS');
}
function speak(i = 0) {
  if (G.phase !== 'speaking') return;
  if (i >= SCRIPT.length) { finishSpeech(); return; }
  const [who, text, act] = SCRIPT[i], tok = ++lineToken;
  const next = (extra = 0) => { if (tok !== lineToken) return; lineToken++; captainTalking = false; speaking = 0; setTimeout(() => speak(i + 1), (LINE_GAP + extra) * 1000); };
  if (act === 'proof') startProof();
  const extra = act === 'proof' ? 5 : 0;
  $('say').className = who === 'C' ? 'cap' : '';
  $('say').innerHTML = '<span class="who">' + (who === 'C' ? 'CAPTAIN' : 'THE KEEPER') + '</span>“' + text + '”'; $('say').style.opacity = 1;
  if (who === 'C') { captainTalking = true; captainSay(text, () => next(0)); return; }
  speaking = 1;
  const k = LINES.indexOf(text);
  if (!browserVoice && keeperBufs) {
    const src = actx.createBufferSource(); src.buffer = keeperBufs[k]; src.playbackRate.value = KEEPER_SLOW; src.connect(voiceFx);
    src.onended = () => { playing = null; next(extra); }; src.start(); playing = src; return;
  }
  if (!('speechSynthesis' in window)) { setTimeout(() => next(extra), 7000); return; }
  const u = new SpeechSynthesisUtterance(text); u.pitch = 0; u.rate = 0.58; u.volume = 1; const v = deepVoice(); if (v) u.voice = v;
  u.onend = () => next(extra); speechSynthesis.speak(u);
}
async function listen() {
  if (stopNow().type !== 'keeper' || !G.scanned.keeper || G.phase === 'warp' || G.phase === 'speaking' || G.phase === 'scanning') return;
  $('report').style.opacity = 0;
  G.phase = 'speaking'; startDrone(); if (actx.state === 'suspended') actx.resume();
  if ('speechSynthesis' in window) speechSynthesis.cancel(); if (playing) { try { playing.onended = null; playing.stop(); } catch (e) { } playing = null; }
  if (!voiceFx) voiceFx = makeVoiceFx();
  if (!keeperBufs && !browserVoice) {
    try { keeperBufs = await makeKeeperVoice(); }
    catch (e) { console.warn('Keeper voice could not load — using the browser voice', e); browserVoice = true; }
  }

}
if ('speechSynthesis' in window) speechSynthesis.getVoices();

/* ---------- HUD, next step and the controls menu ---------- */
let bannerT = 0;
function banner(a, b) { const el = $('banner'); el.querySelector('.a').textContent = a; el.querySelector('.b').textContent = b || ''; el.style.opacity = 1; bannerT = 4.5; }
function nextStep() {
  const S = stopNow();
  if (G.phase === 'warp' || G.phase === 'arriving') return 'IN WARP…';
  if (G.phase === 'scanning') return 'DRONES SCANNING ' + S.name + '…';
  if (S.id === 'earth') return '<button id="go">WARP TO THE FIRST STAR (W)</button>';
  if (S.type === 'keeper') return G.phase === 'speaking' ? 'THE KEEPER IS SPEAKING…' : G.phase === 'done' ? '<button id="go">BACK TO THE MAIN MENU</button>' : !G.scanned.keeper ? '<button id="go">SCAN THE LIGHT (S)</button>' : '<button id="go">LISTEN TO THE KEEPER (L)</button>';
  if (G.phase === 'arrived') return '<button id="go">SCAN THE PLANET (S)</button>';
  if (G.phase === 'light') return '<button id="go">HEAD FOR THE LIGHT (W)</button>';
  if (S.id === 'green') return 'MARKING THE GREEN WORLD ON THE MAP…';
  return '<button id="go">WARP TO THE NEXT STAR (W)</button>';
}
function goAction() {
  const S = stopNow();
  if (S.type === 'keeper') { if (G.phase === 'done') location.href = 'index.html'; else if (!G.scanned.keeper) startScan(); else listen(); }
  else if (G.phase === 'arrived' && S.read) startScan(); else startWarp();
}
function toggleBridge() { G.cam = G.cam === 'bridge' ? 'auto' : 'bridge'; updateCamera.first = true; menuRefresh(); }
const menuEl = $('menu'), menuPanel = $('menuPanel'), openCats = new Set(['ACTIONS']);
let newArm = 0;
function newVoyage() { if (newArm > 0) { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } location.reload(); } else { newArm = 3; menuRefresh(); } }
function menuData() {
  const log = STOPS.slice(1, -1).filter(S => G.scanned[S.id]).map(S => ['row', S.id === 'green' && G.named ? 'UNITY' : S.name, S.id === 'green' ? 'PERFECT · EMPTY' : 'NO LIFE', S.id === 'green']);
  return [
    ['ACTIONS', [['Scan the planet', 'S', startScan], ['Warp to the next star', 'W', startWarp], ['Listen to the Keeper', 'L', listen]]],
    ['VOYAGE LOG', log.length ? log : [['text', 'No planets scanned yet.']]],
    ['CAMERA', [['Camera: ' + G.cam, 'C', () => { G.cam = G.cam === 'auto' ? 'free' : 'auto'; menuRefresh(); }], ['Bridge view (on / off)', 'B', toggleBridge], ['text', 'Look: drag · Pan: right-drag · Zoom: scroll']]],
    ['DISPLAY', [['Hide / show info', 'H', () => document.body.classList.toggle('hideInfo')], ['Open / close this menu', 'M', () => menuEl.classList.toggle('open')]]],
    ['GAME', [['Back to the main menu', '', () => { location.href = 'index.html'; }], [newArm > 0 ? 'Tap again to start over' : 'Start the voyage again', '', newVoyage]]],
  ];
}
let menuSig = '';
function menuRefresh() {
  const data = menuData(), sig = JSON.stringify(data.map(([c, it]) => [c, it.map(x => typeof x[2] === 'function' ? x.slice(0, 2) : x)]));
  if (sig === menuSig) return; menuSig = sig; menuPanel.innerHTML = '';
  for (const [cat, items] of data) {
    const c = document.createElement('div'); c.className = 'mcat' + (openCats.has(cat) ? ' open' : '');
    const h = document.createElement('div'); h.className = 'mhead'; h.innerHTML = cat + '<i>▶</i>';
    h.onclick = () => { c.classList.toggle('open'); if (c.classList.contains('open')) openCats.add(cat); else openCats.delete(cat); };
    const list = document.createElement('div'); list.className = 'mitems';
    for (const it of items) {
      const b = document.createElement('div');
      if (it[0] === 'text') { b.className = 'mitem info text'; b.textContent = it[1]; }
      else if (it[0] === 'row') { b.className = 'mitem info'; b.innerHTML = '<span>' + it[1] + '</span><b class="' + (it[3] ? 'ok' : '') + '">' + it[2] + '</b>'; }
      else { b.className = 'mitem'; b.innerHTML = '<span>' + it[0] + '</span>' + (it[1] ? '<kbd>' + it[1] + '</kbd>' : ''); b.onclick = it[2]; }
      list.appendChild(b);
    }
    c.append(h, list); menuPanel.appendChild(c);
  }
}
$('menuBtn').onclick = () => menuEl.classList.toggle('open');
controls.addEventListener('start', () => { G.cam = 'free'; menuRefresh(); });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 's') startScan(); else if (k === 'w') startWarp(); else if (k === 'l') listen();
  else if (k === 'b') toggleBridge();
  else if (k === 'c') { G.cam = G.cam === 'auto' ? 'free' : 'auto'; updateCamera.first = G.cam === 'auto'; menuRefresh(); } else if (k === 'h') document.body.classList.toggle('hideInfo'); else if (k === 'm') menuEl.classList.toggle('open');
});
function hud(dt) {
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').style.opacity = 0; }
  const S = stopNow(), n = STOPS.length - 2, visited = Math.min(n, Math.max(0, G.stop - 0));
  const day = (window.WB_DAY_START || 0) + Math.max(1, Math.min(G.stop, STOPS.length - 1));
  // ship's clock: each stop is one day — morning on arrival, the scan through the afternoon, the warp through the night
  const ph = G.phase, p = ph === 'scanning' && scan ? 0.15 + 0.35 * Math.min(1, scan.t / scan.dur) : ph === 'scanned' || ph === 'light' ? 0.5 : ph === 'speaking' ? 0.4 : ph === 'done' ? 0.6 : (ph === 'warp' || ph === 'arriving') && warp ? 0.6 + 0.4 * Math.min(1, warp.t / warp.dur) : 0.1;
  const tgt = (Math.max(1, G.stop) - 1) * 24 + 6 + 24 * p; hud.hr = hud.hr === undefined || Math.abs(tgt - hud.hr) > 30 ? tgt : hud.hr + (tgt - hud.hr) * Math.min(1, dt * 0.5);
  const hh = ((hud.hr % 24) + 24) % 24, clock = String(Math.floor(hh)).padStart(2, '0') + ':' + String(Math.floor((hh % 1) * 60)).padStart(2, '0');
  let h = `<h1>THE SEEKER'S VOYAGE</h1><div class="ln" style="color:#ffd060;letter-spacing:3px">DAY ${day} · SHIP TIME ${clock}</div><div class="bn">${S.type === 'keeper' ? 'THE KEEPER' : (S.id === 'green' && G.named ? 'UNITY' : S.name)}</div><div class="ln">${S.type === 'keeper' ? 'LIGHT YEARS FROM EARTH' : S.id === 'earth' ? 'LEAVING HOME' : 'PLANET ' + visited + ' OF ' + n}</div>`;
  if (h !== hud.last) { $('panel').innerHTML = h; hud.last = h; }
  const a = '<div style="font-size:10px;letter-spacing:3px;color:#8fb0c8;margin-bottom:4px">NEXT STEP</div>' + nextStep();
  if (a !== hud.lastA) { $('action').innerHTML = a; hud.lastA = a; const go = $('go'); if (go) go.onclick = goAction; }
  if (menuEl.classList.contains('open')) menuRefresh();
}

/* ---------- camera ---------- */
updateCamera.first = true;
function inBridge() { return G.cam === 'bridge' || (G.cam === 'auto' && captainTalking); }
const bridgeLook = V(0, 0, -3000); let wasBridge = false;
function updateCamera(dt, t) {
  const S = stopNow(), bridgeOn = G.cam === 'bridge' || (G.cam === 'auto' && captainTalking);
  controls.enabled = G.cam !== 'bridge';
  const wantNear = bridgeOn ? 0.1 : 1, wantFov = bridgeOn ? 55 : 45;
  if (camera.near !== wantNear || camera.fov !== wantFov) { camera.near = wantNear; camera.fov = wantFov; camera.updateProjectionMatrix(); }
  if (bridgeOn) {
    ship.updateMatrixWorld(); const eye = ship.localToWorld(V(0, 26.85, 32.4)), ahead = ship.localToWorld(V(0, 26, 3000));
    let look = !warp && world ? ahead.clone().lerp(world.position, S.type === 'keeper' ? 0.85 : 0.2) : ahead;
    // keep the eyes out the front window, never down at the floor
    const d = look.clone().sub(eye).normalize(); d.y = Math.max(-0.08, Math.min(0.25, d.y)); d.normalize(); look = eye.clone().addScaledVector(d, 3000);
    bridgeLook.lerp(look, wasBridge ? 1 - Math.exp(-dt * 2) : 1); wasBridge = true;
    camera.position.copy(eye); controls.target.copy(bridgeLook); camera.lookAt(bridgeLook); return;
  }
  if (wasBridge) { wasBridge = false; updateCamera.first = true; }
  if (G.cam !== 'auto') { controls.update(); return; }
  let eye, look;
  if (warp) { eye = V(260, 110, 600); look = V(0, 10, -300); }
  else if (S.type === 'keeper') { eye = V(420, 560, 1150); look = V(0, -40, -1300); }
  else if (G.phase === 'light') { const d = LIGHT_POS.clone().normalize(); eye = d.clone().multiplyScalar(-750).add(V(-120, 160, 0)); look = d.clone().multiplyScalar(3000); }
  else { const P = world ? world.position : V(0, 0, -2000), a = 0.6 + Math.sin(t * 0.05) * 0.35; look = P.clone().multiplyScalar(0.12); eye = V(Math.sin(a) * 700, 220 + Math.sin(t * 0.07) * 60, Math.cos(a) * 700); }
  const k = updateCamera.first ? 1 : 1 - Math.exp(-dt * 1.2); updateCamera.first = false;
  camera.position.lerp(eye, k); controls.target.lerp(look, k); camera.lookAt(controls.target);
}

/* ---------- start ---------- */
if (G.stop >= STOPS.length) G.stop = STOPS.length - 1;
buildStop();
if (G.phase === 'scanned' && stopNow().read) showReport(false);
if (G.phase === 'light') farLight.visible = true;
menuRefresh();
banner(stopNow().type === 'keeper' ? 'THE KEEPER' : stopNow().name, stopNow().intro || stopNow().what || '');
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
/* ---------- ship sounds: a quiet, smooth engine hum (made by the computer, no sound files) ---------- */
const SND = (() => {
  let ctx = null, airG, airF, humG, hums = [], rushG, rushF;
  const BASE = [55, 82.5, 110];
  function noise(seconds) {
    const len = ctx.sampleRate * seconds | 0, buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); let last = 0; for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; } }
    const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s;
  }
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const master = ctx.createGain(); master.gain.value = 1.8; master.connect(ctx.destination);
    // soft low hum: pure tones with a slow, gentle wobble
    const hf = ctx.createBiquadFilter(); hf.type = 'lowpass'; hf.frequency.value = 260; humG = ctx.createGain(); humG.gain.value = 0; hf.connect(humG); humG.connect(master);
    hums = BASE.map((f, i) => { const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f; const g = ctx.createGain(); g.gain.value = [0.5, 0.25, 0.15][i]; o.connect(g); g.connect(hf); o.start();
      const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = 0.15 + i * 0.07; lg.gain.value = f * 0.004; l.connect(lg); lg.connect(o.frequency); l.start(); return o; });
    // a soft, muffled air sound underneath
    airF = ctx.createBiquadFilter(); airF.type = 'lowpass'; airF.frequency.value = 180; airF.Q.value = 0.3; airG = ctx.createGain(); airG.gain.value = 0;
    noise(4).connect(airF); airF.connect(airG); airG.connect(master);
    // a gentle rush that only comes up in warp
    rushF = ctx.createBiquadFilter(); rushF.type = 'lowpass'; rushF.frequency.value = 500; rushG = ctx.createGain(); rushG.gain.value = 0;
    noise(3).connect(rushF); rushF.connect(rushG); rushG.connect(master);
  }
  addEventListener('pointerdown', init); addEventListener('keydown', init);
  // power 0–1 = how hard the engines are working, speed 0–1 = how fast, warp 0–1 = in warp
  function set(power, speed, warp = 0) {
    if (!ctx) return; const t = ctx.currentTime;
    humG.gain.setTargetAtTime(power * 0.09, t, 0.8);
    hums.forEach((o, i) => o.frequency.setTargetAtTime(BASE[i] * (1 + speed * 0.15 + warp * 0.1), t, 1.2));
    airG.gain.setTargetAtTime(power * 0.07, t, 0.8); airF.frequency.setTargetAtTime(150 + speed * 150, t, 1);
    rushG.gain.setTargetAtTime(warp * 0.06, t, 0.8); rushF.frequency.setTargetAtTime(350 + warp * 350, t, 1);
  }
  return { set, init };
})();
const clock = new THREE.Clock();
window.VOYAGE = { G, camera, controls, startScan, startWarp, listen, startProof, endProof };
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  if (newArm > 0) { newArm -= dt; if (newArm <= 0) menuRefresh(); }
  teal.color.setRGB(0.25, 1.3 + 0.25 * Math.sin(t * 2), 1.25 + 0.25 * Math.sin(t * 2));
  blinks.forEach((b, i) => b.visible = Math.sin(t * 3 - i * 1.3) > 0.4);
  updateScan(dt, t); updateWarp(dt); updateProof(dt, t);
  if (!warp) warpRamp = 0;
  { const quiet = G.phase === 'speaking' ? 0.4 : 1; SND.set((0.3 + 0.7 * warpRamp) * quiet, 0.15 + 0.85 * warpRamp, warpRamp); }   // the Seeker's engines
  for (const c of crowd) PEOPLE.A[c.act](c.P, t, dt);
  if (world && world.userData.body) { world.userData.body.rotation.y += dt * 0.01; if (world.userData.clouds) world.userData.clouds.rotation.y += dt * 0.014; }
  if (keeperRings && stopNow().type === 'keeper') {
    for (const r of keeperRings) { if (r.vertical) r.piv.rotation.y += dt * r.sp * r.dir * ringSpeed * ringFlow; else r.piv.rotation.x += dt * r.sp * r.dir * ringSpeed * ringFlow; }
    world.userData.motes.rotation.y += dt * 0.02;
    pulse += ((speaking ? 1 : 0) - pulse) * Math.min(1, dt * 1.5);
    const beat = 1 + (0.06 + pulse * 0.25) * (0.5 + 0.5 * Math.sin(t * (1.2 + pulse * 2)));
    keeperCore.coreMat.color.setRGB(2.0 * beat, 1.55 * beat, 0.9 * beat); keeperCore.halo.scale.setScalar(1500 * (0.95 + 0.25 * pulse * beat));
    if (!warp) bloom.strength = (inBridge() ? 0.3 : 0.45) + 0.3 * pulse;
  }
  if (farLight.visible) { const f = 0.85 + 0.15 * Math.sin(t * 7) * Math.sin(t * 2.3); farLight.children.forEach(c => c.material.opacity = f); farLight.rotation.z += dt * 0.05; }
  updateCamera(dt, t);
  hud(dt);
  composer.render();
});
