  const h = `<h1>THE SIXTEENTH COUNCIL MEETING</h1><div class="ln" style="color:#ffd060;letter-spacing:3px">DAY ${day} · ${DN.clock}${DN.isNight ? ' · NIGHT' : ''}</div><div class="ln">SUNRISE ${DN.SUNRISE} · SUNSET ${DN.SUNSET}</div><div class="bn">THE COUNCIL HALL · PLANET UNITY</div><div class="ln">${line}</div>`;
  if (h !== hud.last) { $('panel').innerHTML = h; hud.last = h; }
  const a = '<div style="font-size:10px;letter-spacing:3px;color:#8fb0c8;margin-bottom:4px">NEXT STEP</div>' + nextStep();
  if (a !== hud.lastA) { $('action').innerHTML = a; hud.lastA = a; const go = $('go'); if (go) go.onclick = goAction; const sk = $('skip'); if (sk) sk.onclick = skip; }
  if (menuEl.classList.contains('open')) menuRefresh();
}
function autoView(t) {
  if (G.phase === 'meeting' && speaker) { const p = speaker.P.root.position, out = V(-p.x, 0, -p.z).normalize(); return [V(p.x + out.x * 7 + out.z * 2.5, 3.2, p.z + out.z * 7 - out.x * 2.5), V(p.x, 1.9, p.z)]; }
  if (G.phase === 'meeting' && showHolo >= 0) return VIEWS.heart;
  if (G.phase === 'voting' || G.phase === 'ballot') return VIEWS.ring;
  if (G.phase === 'keeper' || G.done) return [V(Math.sin(t * 0.05) * 24, 8, Math.cos(t * 0.05) * 24), V(0, 8.5, 0)];
  const a = t * 0.05; return [V(Math.sin(a) * 34, 13, Math.cos(a) * 34), V(0, 5, 0)];
}
function updateCamera(dt, t) {
  if (G.cam === 'free') { controls.update(); return; }
  const v = G.view === 'auto' ? autoView(t) : VIEWS[G.view];
  const k = camFirst ? 1 : 1 - Math.exp(-dt * 1.4); camFirst = false;
  camera.position.lerp(v[0], k); controls.target.lerp(v[1], k); camera.lookAt(controls.target);
}

/* ---------- the loop ---------- */
const clock = new THREE.Clock();
if (G.done) { showHolo = G.choice; holoGrow = 1; bigHolo = true; }
banner('THE SIXTEENTH COUNCIL MEETING', G.done ? 'UNITY WILL BUILD ' + PROPS[G.choice].name : 'THE ANIMAL CARE CENTRE IS OPEN · THE TWELVE MEET AGAIN');
menuRefresh();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  // the meeting begins in the afternoon and ends at sunset
  const prog = G.done ? 0.5 : G.phase === 'ready' ? 0.3 : G.phase === 'meeting' ? 0.32 + 0.12 * Math.max(0, step) / SCRIPT.length : G.phase === 'keeper' ? 0.49 : 0.45;
  DN.update(dt, 0, prog, true, [sun, hemiMain], sun);
  const night = DN.dark; lampGlow.emissiveIntensity = 0.3 + night * 2; for (const l of hallLights) l.intensity = 10 + night * 50;
  // the Heart turns, and flares when it speaks
  rings.forEach((r, i) => { r.rotation.y += dt * (0.3 + i * 0.15) * (i === 1 ? -1 : 1); r.rotation.x = Math.sin(t * 0.2 + i) * 0.5; });
  heartPulse = Math.max(G.phase === 'keeper' ? 0.6 : 0, heartPulse - dt * 0.3);
  halo.scale.setScalar(11 + Math.sin(t * 1.5) * 0.6 + heartPulse * 8); heartLight.intensity = 60 + heartPulse * 160;
  // the hologram of the proposal being spoken about
  holoGrow = Math.min(1, holoGrow + dt * 0.8);
  holos.forEach((h, k) => { h.visible = k === showHolo; });
  const s = holoGrow * holoGrow * (3 - 2 * holoGrow) * (bigHolo ? 1.35 : 1); holo.scale.setScalar(Math.max(0.001, s)); holo.rotation.y += dt * 0.3;
  holo.position.y = (bigHolo ? 6.5 : 5.5) + Math.sin(t * 0.8) * 0.2;
  for (const c of crowd) (PEOPLE.A[c.act] || PEOPLE.A.idle)(c.P, t, dt);
  updateCamera(dt, t);
  hud(dt);
  composer.render();
});

</script>
